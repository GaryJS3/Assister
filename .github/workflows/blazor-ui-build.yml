name: Blazor UI build
on:
  push:
    branches: [main, blazor-server-ui-migration]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Assister.sln
      - name: Build
        run: dotnet build Assister.sln --no-restore --configuration Release
